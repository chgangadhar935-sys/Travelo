<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login &mdash; TRAVELO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="destination-page-body">
    <div class="app-wrapper full-dest-wrapper">
      <header id="main-header">
        <a href="index.html" class="logo-link">
          <div class="logo">
            <div class="logo-icon"><div class="logo-dot"></div></div>
            <span class="logo-text">TRAVELO</span>
          </div>
        </a>
        <nav class="nav-links">
          <a href="index.html" class="btn-login">&larr; BACK TO GLOBE</a>
        </nav>
      </header>

      <div class="auth-page">
        <div class="auth-box">
          <h2>Welcome Back</h2>
          <p>Enter your credentials to access your TRAVELO account</p>
          <form id="login-form">
            <input type="email" id="email" placeholder="Email Address" required />
            <input type="password" id="password" placeholder="Password" required />
            <p class="error-msg" id="error-msg"></p>
            <button type="submit" class="auth-submit">LOGIN</button>
          </form>
          <p class="auth-switch">Don't have an account? <a href="signup.html">Sign Up</a></p>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
    <script>
      document.getElementById('login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value.trim();

        if (Auth.login(email, pass)) {
          window.location.href = 'index.html';
        } else {
          Auth.signup(email.split('@')[0] || 'User', email, pass);
          window.location.href = 'index.html';
        }
      });
    </script>
  </body>
</html>
